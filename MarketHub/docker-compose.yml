services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    # Instala dependencias y arranca nodemon (hot reload)
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Instala dependencias y arranca el servidor de desarrollo de Angular accesible desde el host
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
